
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alex-nano-bot
    restart: unless-stopped
    # Потолок памяти: при нехватке OOM-killer бьёт этот контейнер, а не соседей по серверу
    mem_limit: ${BOT_MEM_LIMIT:-1280m}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./skills:/app/skills
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  showcase:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alex-nano-showcase
    restart: unless-stopped
    mem_limit: ${SHOWCASE_MEM_LIMIT:-1280m}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./skills:/app/skills
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m app.bot_showcase
    profiles: ["showcase"]
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge

volumes:
  data:
    driver: local
  logs:
    driver: local
  skills:
    driver: local
