# Единый набор правил линтера для локального запуска и CI.
# CI ставит ruff командой `pip install ruff` (без пина): у свежих версий
# расширенный дефолт (UP, RUF, BLE...), из-за чего проверки расходились
# с локальным ruff. Этот конфиг фиксирует набор для любой версии.

target-version = "py310"

[lint]
# E4/E7/E9 + F — прежний стабильный дефолт ruff (pycodestyle-ошибки + pyflakes).
# I — сортировка импортов (isort-совместимая), применяется автофиксом.
select = ["E4", "E7", "E9", "F", "I"]

# Намеренно НЕ включены (можно включить отдельно, когда будет согласовано):
#   UP   — модернизация аннотаций (List→list, Optional[X]→X | None):
#          массовый дифф по всем модулям без изменения поведения;
#   BLE  — BLE001 (широкий `except Exception`): осознанный стиль обработчиков
#          бота — падение агента/хендлера всегда должно превращаться в
#          сообщение пользователю, а не ронять polling;
#   RUF  — RUF012 (ClassVar) и прочие строгие правила стиля.
